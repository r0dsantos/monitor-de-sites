name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar testes
        run: python -m unittest -v

      - name: Construir imagem Docker
        run: docker build -t monitor-de-sites
